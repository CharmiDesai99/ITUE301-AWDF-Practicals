version: '3.8'

services:
  # 1. React Frontend Service (Practical 11)
  frontend:
    build:
      context: ./student-portfolio
      dockerfile: Dockerfile
    container_name: awf-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

  # 2. Node.js Express REST API Service (Practical 11)
  backend:
    build:
      context: ./task-manager-api
      dockerfile: Dockerfile
    container_name: awf-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/task_manager_api
      - JWT_SECRET=super_secret_jwt_key_practical7_2026
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - app-network
    restart: unless-stopped

  # 3. Official MongoDB Database Service (Practical 11)
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    restart: unless-stopped

# Isolated Bridge Network connecting all 3 full-stack containers
networks:
  app-network:
    driver: bridge

# Named Volume for persisting MongoDB documents across container restarts
volumes:
  mongo-data:
    driver: local
